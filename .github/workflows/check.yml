name: Contrôle du code (lint)

on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: |
          chmod +x gradlew
          ./gradlew lintDebug --no-daemon || true
          f=$(ls app/build/reports/lint-results-debug.txt 2>/dev/null || true)
          if [ -n "$f" ]; then echo "===REPORT==="; grep -E "Error:|Warning:" "$f" | grep -v "GradleDependency\|NewerVersionAvailable\|ObsoleteSdkInt\|UnusedResources\|IconLauncherShape\|IconDensities\|IconMissingDensityFolder\|MonochromeLauncherIcon\|AndroidGradlePluginVersion" | head -200; fi
